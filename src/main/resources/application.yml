#application
server:
  port: 50900
  tomcat.threads.max: 20
  forward-headers-strategy: FRAMEWORK

#vthreads
spring.threads.virtual.enabled: "true"

#monitoring
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,prometheus,heapdump"

#tracing
spring.application.name: callee-service
management.tracing.sampling.probability: "1.0"
logging.level.io.opentelemetry.exporter: "OFF"
management.opentelemetry.tracing.export.otlp.endpoint: "http://localhost:4318/v1/traces"

#otel collector (prometheus) metrics configuration, disabled currently, for details https://spring.io/blog/2025/11/18/opentelemetry-with-spring-boot
#management.otlp.metrics.export.url: "http://otel-collector:4318/v1/metrics"
logging.level.io.micrometer.registry.otlp: "OFF"

#logging
logging.pattern.level: "%5p tenantId=%X{tenantId:-}" #"%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] tenantId=%X{tenantId:-}"

logging.level.root: "WARN"
logging.level.org.springframework: "INFO"

logging.level.org.goafabric: "INFO"
logging.level.org.flywaydb.core: "INFO"
logging.level.org.hibernate.SQL: "INFO"

# mcp
spring.ai.mcp.server.protocol: "streamable" # "STATELESS" , currently would only work with 2.0, but bugs out because of missing "/discover" endpoint
